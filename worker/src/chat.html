<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scout — Data Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b2a40;
    --card: #14435e;
    --card-border: #1d5573;
    --mint: #9dd3bc;
    --gold: #ecaf5f;
    --pink: #e08bb0;
    --text: #ffffff;
    --muted: #8a97a3;
    --error: #f2879a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", "IBM Plex Sans Arabic", -apple-system, sans-serif;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 22px 28px 20px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .accent-bar {
    width: 5px;
    height: 34px;
    border-radius: 3px;
    background: var(--mint);
    flex-shrink: 0;
  }
  .brand-text .kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--mint);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .brand-text h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .domain {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 400;
    padding-bottom: 2px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 8px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 420px;
    line-height: 1.75;
    padding: 20px 0;
  }
  .empty-state .headline {
    color: var(--text);
    font-weight: 600;
    font-size: 17px;
    margin-bottom: 8px;
  }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    justify-content: center;
    margin-top: 22px;
  }
  .pill {
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--bg);
    cursor: pointer;
    font-family: inherit;
  }
  .pill:hover { filter: brightness(1.08); }
  .pill.gold { background: var(--gold); }
  .pill.pink { background: var(--pink); }
  .pill.mint { background: var(--mint); }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }

  .avatar-sm {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    margin-top: 2px;
  }
  .msg.bot .avatar-sm { background: var(--mint); color: var(--bg); }
  .msg.user .avatar-sm { background: #23303c; color: var(--muted); }

  .bubble {
    padding: 11px 16px;
    border-radius: 14px;
    line-height: 1.75;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble {
    background: var(--mint);
    color: var(--bg);
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot .bubble.error {
    border-color: var(--error);
    color: #ffd7de;
  }

  .bubble.table-bubble { padding: 12px 14px; }
  .sql-used {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    background: rgba(0, 0, 0, 0.15);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .table-scroll {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--card-border);
  }
  .table-scroll table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .table-scroll th, .table-scroll td {
    padding: 7px 12px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--card-border);
  }
  .table-scroll th {
    color: var(--mint);
    font-weight: 600;
    background: rgba(157, 211, 188, 0.08);
  }
  .table-scroll tbody tr:last-child td { border-bottom: none; }
  .table-scroll tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
  .table-empty { color: var(--muted); font-size: 13.5px; padding: 4px 0; }
  .table-note { margin-top: 8px; font-size: 11.5px; color: var(--muted); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  footer {
    padding: 14px 24px 24px;
    flex-shrink: 0;
  }
  form {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 6px 6px 6px 16px;
  }
  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    font-family: inherit;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  button {
    background: var(--mint);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:not(:disabled):hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="accent-bar"></div>
      <div class="brand-text">
        <div class="kicker">Scout · Data Agent</div>
        <h1>Scout</h1>
      </div>
    </div>
    <div class="domain">demo</div>
  </header>

  <main id="thread">
    <div class="empty-state" id="empty">
      <div class="headline">Hi, I'm Scout.</div>
      <div>Ask about orders, customers, or leads — I'll answer using live data.</div>
      <div class="suggestions">
        <button type="button" class="pill gold">How many orders today?</button>
        <button type="button" class="pill pink">What's this month's daily average?</button>
        <button type="button" class="pill mint">New leads this week?</button>
      </div>
    </div>
  </main>

  <footer>
    <form id="askForm">
      <input type="text" id="questionInput" placeholder="Ask a question..." autocomplete="off" dir="auto" />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </footer>

  <script>
    const thread = document.getElementById('thread');
    const empty = document.getElementById('empty');
    const form = document.getElementById('askForm');
    const input = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(role, text, isError) {
      empty.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const av = document.createElement('div');
      av.className = 'avatar-sm';
      av.textContent = role === 'user' ? 'Y' : 'S';
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (isError ? ' error' : '');
      bubble.setAttribute('dir', 'auto');
      bubble.textContent = text;
      wrap.appendChild(av);
      wrap.appendChild(bubble);
      thread.appendChild(wrap);
      thread.scrollTop = thread.scrollHeight;
      return bubble;
    }

    function addTyping() {
      empty.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      wrap.id = 'typingIndicator';
      const av = document.createElement('div');
      av.className = 'avatar-sm';
      av.textContent = 'S';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      wrap.appendChild(av);
      wrap.appendChild(bubble);
      thread.appendChild(wrap);
      thread.scrollTop = thread.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function addTable(data) {
      empty.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      const av = document.createElement('div');
      av.className = 'avatar-sm';
      av.textContent = 'S';
      const bubble = document.createElement('div');
      bubble.className = 'bubble table-bubble';

      const sqlEl = document.createElement('div');
      sqlEl.className = 'sql-used';
      sqlEl.textContent = data.sql;
      bubble.appendChild(sqlEl);

      if (!data.rows || data.rows.length === 0) {
        const noRows = document.createElement('div');
        noRows.className = 'table-empty';
        noRows.textContent = 'No rows returned.';
        bubble.appendChild(noRows);
      } else {
        const scrollWrap = document.createElement('div');
        scrollWrap.className = 'table-scroll';
        const table = document.createElement('table');

        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        data.cols.forEach((c) => {
          const th = document.createElement('th');
          th.textContent = c;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        data.rows.forEach((row) => {
          const tr = document.createElement('tr');
          data.cols.forEach((c) => {
            const td = document.createElement('td');
            const val = row[c];
            td.textContent = val === null || val === undefined ? '—' : String(val);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        scrollWrap.appendChild(table);
        bubble.appendChild(scrollWrap);

        const note = document.createElement('div');
        note.className = 'table-note';
        note.textContent = data.truncated
          ? `Showing first ${data.rows.length} of ${data.row_count} rows.`
          : `${data.row_count} row${data.row_count === 1 ? '' : 's'}`;
        bubble.appendChild(note);
      }

      wrap.appendChild(av);
      wrap.appendChild(bubble);
      thread.appendChild(wrap);
      thread.scrollTop = thread.scrollHeight;
    }

    async function ask(question) {
      addMessage('user', question);
      input.value = '';
      sendBtn.disabled = true;
      addTyping();

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        removeTyping();
        if (!res.ok || data.error) {
          addMessage('bot', 'Something went wrong: ' + (data.error || res.statusText), true);
        } else if (data.type === 'table') {
          addTable(data);
        } else {
          addMessage('bot', data.text);
        }
      } catch (err) {
        removeTyping();
        addMessage('bot', "Couldn't reach the server: " + err.message, true);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (q) ask(q);
    });

    document.querySelectorAll('.pill').forEach((btn) => {
      btn.addEventListener('click', () => ask(btn.textContent));
    });
  </script>
</body>
</html>
